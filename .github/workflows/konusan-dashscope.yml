name: Konusan Karakter (DashScope s2v/EMO deneme)

# ElevenLabs (Turkce ses) + DashScope dijital-insan (wan2.2-s2v / EMO) ile
# dudak senkronlu konusan karakter DENEMESI. Replicate GEREKMEZ; senin
# mevcut DASHSCOPE_API_KEY + ELEVENLABS_API_KEY secret'larini kullanir.
#
# NOT: s2v/EMO Cin-bolgesi agirlikli; uluslararasi anahtarla bolge hatasi
# donebilir. Bu workflow tam da bunu kesin olcmek icin. Cin hesabin varsa
# secret ekle: DASHSCOPE_BASE_URL = https://dashscope.aliyuncs.com

on:
  workflow_dispatch:
    inputs:
      gorsel:
        description: "Karakter gorseli (repo yolu)"
        required: true
        default: "karakterler/kaan.jpeg"
      metin:
        description: "Karakterin soyleyecegi Turkce cumle"
        required: true
        default: "Merhaba arkadaslar! Ben Kaan. Bugun sizinle cok eglenceli bir maceraya cikacagiz!"
      voice_id:
        description: "ElevenLabs voice_id"
        required: false
        default: "pNInz6obpgDQGcFmaJgB"

jobs:
  konusan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: 1) ElevenLabs ile Turkce ses
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then echo "::error::ELEVENLABS_API_KEY yok"; exit 1; fi
          python ses_eleven.py \
            --metin "${{ github.event.inputs.metin }}" \
            --voice-id "${{ github.event.inputs.voice_id }}" \
            --cikti "klipler/ses.mp3"

      - name: 2) Sesi gecici public host'a yukle (URL al)
        id: sesurl
        run: |
          # DashScope image_url/audio_url herkese acik URL ister; sesi catbox'a yukle
          AUDIO_URL=$(curl -s -F "reqtype=fileupload" -F "fileToUpload=@klipler/ses.mp3" https://catbox.moe/user/api.php)
          echo "Ses URL: $AUDIO_URL"
          case "$AUDIO_URL" in
            https://*) echo "audio_url=$AUDIO_URL" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Ses yuklenemedi: $AUDIO_URL"; exit 1 ;;
          esac

      - name: 3) DashScope s2v/EMO ile konusan video
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DASHSCOPE_BASE_URL: ${{ secrets.DASHSCOPE_BASE_URL }}
        run: |
          if [ -z "$DASHSCOPE_API_KEY" ]; then echo "::error::DASHSCOPE_API_KEY yok"; exit 1; fi
          IMG_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/${{ github.event.inputs.gorsel }}"
          echo "Gorsel URL: $IMG_URL"
          python wan_s2v_dashscope.py \
            --img-url "$IMG_URL" \
            --audio-url "${{ steps.sesurl.outputs.audio_url }}" \
            --cikti "klipler/konusan.mp4"

      - name: Ciktilari artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: konusan-dashscope
          path: |
            klipler/konusan.mp4
            klipler/ses.mp3
          if-no-files-found: warn
          retention-days: 30
