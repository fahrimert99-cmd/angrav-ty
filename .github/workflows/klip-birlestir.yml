name: Klip Birlestir - ASMR

# Kullanicinin klipler/ klasorune yukledigi gunluk video kliplerini otomatik
# birlestirir ve hedef sureye dongulenmis uzun bir ASMR videosu uretir.
# - Otomatik: klipler/ altina video push edilince calisir.
# - Manuel: Actions -> "Klip Birlestir - ASMR" -> Run workflow.
# Klip sesleri KORUNUR (config klip.ses ile degistirilebilir). Anahtar gerekmez.

on:
  push:
    paths:
      - 'klipler/**.mp4'
      - 'klipler/**.mov'
      - 'klipler/**.webm'
      - 'klipler/**.mkv'
      - 'klipler/**.m4v'
      - 'klipler/**.avi'
  workflow_dispatch:
    inputs:
      sure:
        description: "Hedef sure (saniye - 1800 = 30 dk, 3600 = 60 dk)"
        required: false
        default: "1800"
      gizlilik:
        description: "YouTube gizlilik (public / unlisted / private)"
        required: false
        default: "public"

jobs:
  birlestir:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Klip var mi kontrol et
        id: kontrol
        run: |
          SAYI=$(find klipler -type f \( -iname '*.mp4' -o -iname '*.mov' \
            -o -iname '*.webm' -o -iname '*.mkv' -o -iname '*.m4v' \
            -o -iname '*.avi' \) 2>/dev/null | wc -l)
          echo "Bulunan klip sayisi: $SAYI"
          echo "sayi=$SAYI" >> $GITHUB_OUTPUT

      - name: Python kur
        if: steps.kontrol.outputs.sayi != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg kur
        if: steps.kontrol.outputs.sayi != '0'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python bagimliliklari
        if: steps.kontrol.outputs.sayi != '0'
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow moviepy imageio-ffmpeg
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Ayar dosyasini olustur
        if: steps.kontrol.outputs.sayi != '0'
        run: cp config/ayarlar.ornek.yaml config/ayarlar.yaml

      - name: Parametreleri ayarla
        if: steps.kontrol.outputs.sayi != '0'
        run: |
          SURE="${{ github.event.inputs.sure }}"
          [ -z "$SURE" ] && SURE="1800"
          echo "SURE=$SURE" >> $GITHUB_ENV
          echo "TARIH=$(date +'%d.%m.%Y')" >> $GITHUB_ENV

      - name: Klipleri birlestir
        if: steps.kontrol.outputs.sayi != '0'
        run: |
          python birlestir.py --klasor klipler --sure "$SURE"
          VIDEO_DOSYA=$(find cikti -name "birlesik_asmr.mp4" 2>/dev/null | sort | tail -n1)
          echo "VIDEO_DOSYA=$VIDEO_DOSYA" >> $GITHUB_ENV
          echo "Uretilen video: $VIDEO_DOSYA"

      - name: YouTube'a yukle
        if: steps.kontrol.outputs.sayi != '0' && env.VIDEO_DOSYA != ''
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          if [ -z "$YOUTUBE_OAUTH_JSON" ] || [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "YouTube secret'lari yok, yukleme atlaniyor (video Artifacts'te)."
            exit 0
          fi
          echo "$YOUTUBE_OAUTH_JSON" > client_secret.json
          BASLIK="ASMR | Rahatlama ve Uyku | $TARIH"
          ACIKLAMA=$(printf '%s\n' \
            "Rahatlamak ve huzurla uykuya dalmak icin sakin bir ASMR videosu." \
            "" \
            "Her gun yeni ASMR videolari. Iyi dinlemeler." \
            "" \
            "#asmr #rahatlama #uyku #ambient")
          python scripts/youtube_yukle.py \
            --video "$VIDEO_DOSYA" \
            --baslik "$BASLIK" \
            --aciklama "$ACIKLAMA" \
            --etiketler "asmr,rahatlama,uyku,ambient,relaxing,Turkce" \
            --gizlilik "${{ github.event.inputs.gizlilik || 'public' }}"

      - name: Videoyu Artifact olarak yukle
        if: steps.kontrol.outputs.sayi != '0'
        uses: actions/upload-artifact@v4
        with:
          name: birlesik-asmr-video
          path: cikti/**/birlesik_asmr.mp4
          if-no-files-found: warn
          retention-days: 30
