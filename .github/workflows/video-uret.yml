name: Otonom Pixar Cizgi Film Uretimi (5+ Dk, Bedava)

# Otonom Çizgi Film Üretim İşi (GitHub Actions)
# - Otomatik Tetikleme: Her gün 09:00 UTC'de otonom olarak çalışır.
# - Manuel Tetikleme: Actions → "Otonom Pixar Cizgi Film Uretimi" → "Run workflow".
# - Ücretsiz AI Araçları: Edge-TTS (Ses), Pollinations (Görsel & Metin), MoviePy + FFmpeg (Render).
# - Sonuç: Üretilen 5+ dakikalık MP4 video YouTube'a yüklenir + Artifacts'e eklenir.

on:
  schedule:
    - cron: '0 9 * * *' # Her gün saat 09:00 UTC'de otonom çalışır
  workflow_dispatch:
    inputs:
      konu:
        description: "Bolumun konusu (Bos birakilirsa otomatik secilir)"
        required: false
        default: "Mira ve Ege sihirli ormanda kaybolan yavru ejderhayı arıyor, Kaan ve Selin peşlerinden gidiyor"
      sure:
        description: "Hedef sure (saniye - min 300 = 5dk)"
        required: true
        default: "300"
      karakterler:
        description: "Kullanilacak karakterler (virgulle)"
        required: false
        default: "kaan,selin,mira,ege,dede"
      gizlilik:
        description: "YouTube gizlilik (public / unlisted / private)"
        required: false
        default: "public"

jobs:
  uret:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ──────────────────────────────────────────────
      # 1. DEPO & ARAÇLAR
      # ──────────────────────────────────────────────
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg kur (altyazi gomme + video render)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python bagimliliklari
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client

      # ──────────────────────────────────────────────
      # 2. AYAR DOSYASI
      # ──────────────────────────────────────────────
      - name: Ayar dosyasini olustur
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            SAGLAYICI=claude
          elif [ -n "$GROQ_API_KEY" ]; then
            SAGLAYICI=groq
          elif [ -n "$GEMINI_API_KEY" ]; then
            SAGLAYICI=gemini
          else
            SAGLAYICI=pollinations
          fi
          echo "Senaryo saglayici: $SAGLAYICI"
          sed "s|^  saglayici:.*|  saglayici: \"$SAGLAYICI\"|" \
            config/ayarlar.ornek.yaml > config/ayarlar.yaml

      # ──────────────────────────────────────────────
      # 3. PARAMETRELER
      # ──────────────────────────────────────────────
      - name: Konu ve parametreleri ayarla
        id: params
        run: |
          INPUT_KONU="${{ github.event.inputs.konu }}"
          INPUT_SURE="${{ github.event.inputs.sure }}"
          INPUT_KARAKTER="${{ github.event.inputs.karakterler }}"
          INPUT_GIZLILIK="${{ github.event.inputs.gizlilik }}"

          if [ -z "$INPUT_KONU" ]; then
            TOPICS=(
              "Mira ve Ege su alti kralliginda kayip hazineyi ariyor"
              "Kaan ve Ege uzay roketinde komik uzaylilarla karsilasiyor"
              "Mira Ege ve Ihsan Dede zaman makinesiyle dinozorlar devrine gidiyor"
              "Ege ve Mira robot arkadaslari ile sihirli lunaparki kuruyor"
              "Mira bulutlardaki gizli kalenin sirrini cozmek icin kelebek binisiyor"
              "Selin ve Ihsan Dede mutfakta unutulmaz bir dogum gunu pastasi hazirliyor"
            )
            RANDOM_TOPIC=${TOPICS[$RANDOM % ${#TOPICS[@]}]}
            INPUT_KONU="$RANDOM_TOPIC"
          fi

          [ -z "$INPUT_SURE" ]      && INPUT_SURE="300"
          [ -z "$INPUT_KARAKTER" ]  && INPUT_KARAKTER="kaan,selin,mira,ege,dede"
          [ -z "$INPUT_GIZLILIK" ]  && INPUT_GIZLILIK="public"

          echo "KONU=$INPUT_KONU"           >> $GITHUB_ENV
          echo "SURE=$INPUT_SURE"           >> $GITHUB_ENV
          echo "KARAKTERLER=$INPUT_KARAKTER" >> $GITHUB_ENV
          echo "GIZLILIK=$INPUT_GIZLILIK"   >> $GITHUB_ENV

          # Başlık için tarihi ayarla
          TARIH=$(date +'%d.%m.%Y')
          echo "TARIH=$TARIH"               >> $GITHUB_ENV

      # ──────────────────────────────────────────────
      # 4. VİDEO ÜRETİMİ
      # ──────────────────────────────────────────────
      - name: Karakter gorsellerini uret (Pixar, Pollinations AI)
        run: python karakter_gorsel.py ${KARAKTERLER//,/ } || true

      - name: 5+ Dakikalik Videoyu Uret (Otonom)
        id: video_uret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python main.py --konu "$KONU" --sure "$SURE" --karakterler "$KARAKTERLER"
          
          # Üretilen son video dosyasını bul ve ENV'e kaydet
          VIDEO_DOSYA=$(find cikti -name "*.mp4" -newer requirements.txt 2>/dev/null | sort | tail -n1)
          if [ -z "$VIDEO_DOSYA" ]; then
            VIDEO_DOSYA=$(find cikti -name "*.mp4" 2>/dev/null | sort | tail -n1)
          fi
          echo "VIDEO_DOSYA=$VIDEO_DOSYA" >> $GITHUB_ENV
          echo "Uretilen video: $VIDEO_DOSYA"

      # ──────────────────────────────────────────────
      # 5. YOUTUBE'A YÜKLEME
      # ──────────────────────────────────────────────
      - name: YouTube'a Video Yukle
        id: youtube_yukle
        if: env.VIDEO_DOSYA != ''
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          # client_secret.json oluştur (secret'tan)
          if [ -n "$YOUTUBE_OAUTH_JSON" ]; then
            echo "$YOUTUBE_OAUTH_JSON" > client_secret.json
            echo "✅ client_secret.json oluşturuldu"
          else
            echo "⚠️  YOUTUBE_OAUTH_JSON secret'ı bulunamadı, upload atlanıyor."
            exit 0
          fi

          # Token eksikse yükleme yapılamaz
          if [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "⚠️  YOUTUBE_TOKEN_JSON secret'ı bulunamadı, upload atlanıyor."
            echo "   Lütfen scripts/youtube_token_al.py ile yerel token alın."
            exit 0
          fi

          BASLIK="🎬 Pixar Çizgi Film | $KONU | $TARIH"
          ACIKLAMA="🤖 Bu video yapay zekâ ile tamamen otomatik üretilmiştir!

📖 Konu: $KONU
📅 Tarih: $TARIH
⏱️ Süre: ${SURE} saniye (5+ dakika)
🎨 Teknoloji: Pollinations AI (Pixar görselleri) + Edge-TTS (Türkçe ses) + MoviePy

Bu kanal hakkında:
✨ Her gün yeni bir Pixar tarzı Türkçe çizgi film!
🔔 Abone olun: Yeni bölümler otomatik olarak her gün yayınlanır.

#PixarTarzı #TürkçeÇizgiFilm #YapayZeka #AI #OtonomVideo #Çocuklar"

          python scripts/youtube_yukle.py \
            --video "$VIDEO_DOSYA" \
            --baslik "$BASLIK" \
            --aciklama "$ACIKLAMA" \
            --etiketler "Pixar,Çizgi Film,AI,Türkçe,Otonom,Çocuk,Animasyon,YouTube" \
            --gizlilik "$GIZLILIK"

      # ──────────────────────────────────────────────
      # 6. ARTİFACT OLARAK KAYDET (Yedek)
      # ──────────────────────────────────────────────
      - name: Videoyu Artifact Olarak Yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otonom-pixar-cizgifilm-video
          path: |
            cikti/**/*.mp4
            cikti/**/senaryo.json
          if-no-files-found: warn
          retention-days: 30

      # ──────────────────────────────────────────────
      # 7. ÖZET RAPOR
      # ──────────────────────────────────────────────
      - name: Ozet Rapor
        if: always()
        run: |
          echo "======================================================"
          echo "           OTONOM ÇİZGİ FİLM - ÖZET RAPOR"
          echo "======================================================"
          echo "  Konu       : $KONU"
          echo "  Süre       : $SURE saniye"
          echo "  Karakterler: $KARAKTERLER"
          echo "  Video      : $VIDEO_DOSYA"
          echo "======================================================"
