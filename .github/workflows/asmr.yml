name: ASMR - Rahatlama / Uyku Videosu

# Uzun (30-60+ dk) ASMR videosu uretir.
# - Telifsiz, kodla uretilen ambient ses (yagmur/okyanus/ates/gece/ruzgar/gurultu)
#   + sakinlestirici gorseller (Pollinations, anahtarsiz) uzerinde yavas akis.
# - HIC API ANAHTARI GEREKTIRMEZ. (Isteyen PEXELS_API_KEY ile gercek foto,
#   ELEVENLABS/edge ile anlatim ekleyebilir; YouTube secret'lari ile otomatik yukleme.)
# - Otomatik: her gun 18:00 UTC (~21:00 TR). Manuel: Actions -> "ASMR" -> Run workflow.

on:
  schedule:
    - cron: '0 18 * * *'         # her gun 18:00 UTC (~21:00 TR)
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema: yagmur | okyanus | somine | gece | ruzgar | beyaz | pembe | kahve (veya serbest tarif)"
        required: false
        default: "yagmur"
      sure:
        description: "Hedef sure (saniye - 1800 = 30 dk, 3600 = 60 dk)"
        required: false
        default: "1800"
      gorsel_sayisi:
        description: "Kac farkli gorsel uretilsin (dongude sirayla akar)"
        required: false
        default: "4"
      anlatim:
        description: "(Opsiyonel) yumusak anlatim metni. Bos = sadece ambient ses."
        required: false
        default: ""
      gizlilik:
        description: "YouTube gizlilik (public / unlisted / private)"
        required: false
        default: "public"

jobs:
  asmr:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg kur
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Python bagimliliklari
        run: |
          python -m pip install --upgrade pip
          pip install numpy Pillow requests moviepy imageio-ffmpeg edge-tts
          pip install google-auth-oauthlib google-auth-httplib2 google-api-python-client

      - name: Ayar dosyasini olustur
        run: |
          cp config/ayarlar.ornek.yaml config/ayarlar.yaml
          # PEXELS_API_KEY secret'i varsa gercek foto arka plan kullanilir;
          # yoksa varsayilan Pollinations (anahtarsiz AI gorsel) kalir.
          if [ -n "${{ secrets.PEXELS_API_KEY }}" ]; then
            echo "Sahne motoru: pexels_foto (PEXELS_API_KEY bulundu)"
            sed -i 's|^  motor: "pollinations"|  motor: "pexels_foto"|' config/ayarlar.yaml
          fi

      - name: Parametreleri ayarla
        run: |
          TEMA="${{ github.event.inputs.tema }}"
          SURE="${{ github.event.inputs.sure }}"
          SAYI="${{ github.event.inputs.gorsel_sayisi }}"
          [ -z "$TEMA" ] && TEMA="yagmur"
          [ -z "$SURE" ] && SURE="1800"
          [ -z "$SAYI" ] && SAYI="4"
          echo "TEMA=$TEMA" >> $GITHUB_ENV
          echo "SURE=$SURE" >> $GITHUB_ENV
          echo "SAYI=$SAYI" >> $GITHUB_ENV
          echo "TARIH=$(date +'%d.%m.%Y')" >> $GITHUB_ENV
          # Anlatim metnini (opsiyonel) dosyaya yaz (bosluk/ozel karakter guvenli).
          cat > anlatim.txt <<'ANLATIM_EOF'
          ${{ github.event.inputs.anlatim }}
          ANLATIM_EOF
          if [ -s anlatim.txt ] && grep -q '[^[:space:]]' anlatim.txt; then
            echo "ANLATIM=anlatim.txt" >> $GITHUB_ENV
          else
            echo "ANLATIM=" >> $GITHUB_ENV
          fi

      - name: ASMR videosunu uret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "$ANLATIM" ]; then
            python asmr.py --tema "$TEMA" --sure "$SURE" --gorsel-sayisi "$SAYI" --anlatim "$ANLATIM"
          else
            python asmr.py --tema "$TEMA" --sure "$SURE" --gorsel-sayisi "$SAYI"
          fi
          VIDEO_DOSYA=$(find cikti -name "asmr.mp4" 2>/dev/null | sort | tail -n1)
          echo "VIDEO_DOSYA=$VIDEO_DOSYA" >> $GITHUB_ENV
          echo "Uretilen ASMR videosu: $VIDEO_DOSYA"

      - name: YouTube'a yukle
        if: env.VIDEO_DOSYA != ''
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
        run: |
          if [ -z "$YOUTUBE_OAUTH_JSON" ] || [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "YouTube secret'lari yok, yukleme atlaniyor (video Artifacts'te)."
            exit 0
          fi
          echo "$YOUTUBE_OAUTH_JSON" > client_secret.json
          BASLIK="$TEMA ASMR | Rahatlama ve Uyku | $TARIH"
          ACIKLAMA=$(printf '%s\n' \
            "Rahatlamak ve huzurla uykuya dalmak icin sakin bir ASMR ses ortami." \
            "" \
            "Her gun yeni ASMR videolari. Iyi dinlemeler." \
            "" \
            "#asmr #rahatlama #uyku #ambient")
          python scripts/youtube_yukle.py \
            --video "$VIDEO_DOSYA" \
            --baslik "$BASLIK" \
            --aciklama "$ACIKLAMA" \
            --etiketler "asmr,rahatlama,uyku,ambient,yagmur sesi,relaxing,Turkce" \
            --gizlilik "${{ github.event.inputs.gizlilik || 'public' }}"

      - name: Videoyu Artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asmr-video
          path: |
            cikti/**/asmr.mp4
          if-no-files-found: warn
          retention-days: 30
